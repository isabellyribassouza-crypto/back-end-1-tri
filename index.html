<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>isabelly ribas · dev</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            scroll-behavior: smooth;
        }
        body {
            background: #FFD9E6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1a1a1a;
        }
        .card-light {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
        }
        .card-light:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }
        .btn-dark {
            background-color: #1a1a1a;
            color: #FFD9E6;
            transition: all 0.2s;
        }
        .btn-dark:hover {
            background-color: #2d2d2d;
            transform: translateY(-1px);
        }
        .btn-outline-dark {
            border: 1.5px solid #1a1a1a;
            color: #1a1a1a;
            transition: all 0.2s;
        }
        .btn-outline-dark:hover {
            background-color: #1a1a1a;
            color: #FFD9E6;
        }
        details > summary {
            list-style: none;
            cursor: pointer;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
        .project-item {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        .project-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <!-- Container principal -->
    <div class="max-w-2xl mx-auto">
        
        <!-- CARD PRINCIPAL -->
        <div class="card-light rounded-3xl p-8 md:p-10 shadow-xl">
            
            <!-- Avatar/ícone -->
            <div class="flex justify-center mb-6">
                <div class="w-24 h-24 rounded-full bg-black/10 flex items-center justify-center border-2 border-black/20">
                    <i class="fas fa-laptop-code text-4xl text-black/70"></i>
                </div>
            </div>

            <!-- Nome -->
            <h1 class="text-center text-4xl md:text-5xl font-bold text-black">
                isabelly ribas
            </h1>
            
            <!-- Badge de estudante -->
            <div class="flex justify-center mt-3">
                <span class="bg-black/10 text-black text-sm font-medium px-4 py-1.5 rounded-full">
                    <i class="fas fa-graduation-cap mr-2"></i>estudante de Desenvolvimento de Sistemas
                </span>
            </div>
            
            <!-- Linha decorativa -->
            <div class="flex justify-center gap-2 my-6">
                <span class="w-12 h-0.5 bg-black/30 rounded-full"></span>
                <span class="w-3 h-0.5 bg-black/50 rounded-full"></span>
                <span class="w-12 h-0.5 bg-black/30 rounded-full"></span>
            </div>

            <!-- Seção de projetos (expansível) -->
            <div class="mt-4">
                <details class="group">
                    <summary class="flex items-center justify-between bg-black/5 rounded-xl px-5 py-3 hover:bg-black/10 transition">
                        <span class="font-semibold text-black text-base">
                            <i class="fas fa-code mr-2"></i> projetos
                        </span>
                        <i class="fas fa-chevron-down text-black/60 group-open:rotate-180 transition text-sm"></i>
                    </summary>
                    <div class="mt-3 space-y-2">
                        <div class="project-item flex items-center justify-between py-3 px-2">
                            <div>
                                <p class="font-medium text-black">🌤️ weatherwave</p>
                                <p class="text-black/50 text-sm">app de clima com api</p>
                            </div>
                            <i class="fas fa-arrow-right text-black/40 text-sm"></i>
                        </div>
                        <div class="project-item flex items-center justify-between py-3 px-2">
                            <div>
                                <p class="font-medium text-black">📝 pinknotes</p>
                                <p class="text-black/50 text-sm">bloco de notas local</p>
                            </div>
                            <i class="fas fa-arrow-right text-black/40 text-sm"></i>
                        </div>
                        <div class="project-item flex items-center justify-between py-3 px-2">
                            <div>
                                <p class="font-medium text-black">🎨 ui gallery</p>
                                <p class="text-black/50 text-sm">componentes com tailwind</p>
                            </div>
                            <i class="fas fa-arrow-right text-black/40 text-sm"></i>
                        </div>
                    </div>
                </details>
            </div>

            <!-- Contato + redes sociais -->
            <div class="mt-8 pt-4">
                <p class="text-black/60 text-sm text-center mb-4">—  contato  —</p>
                <div class="flex justify-center gap-6">
                    <a href="#" class="text-black/60 hover:text-black text-2xl transition"><i class="fab fa-github"></i></a>
                    <a href="#" class="text-black/60 hover:text-black text-2xl transition"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" class="text-black/60 hover:text-black text-2xl transition"><i class="fas fa-envelope"></i></a>
                    <a href="#" class="text-black/60 hover:text-black text-2xl transition"><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <!-- Botões de ação -->
            <div class="flex flex-col sm:flex-row gap-3 mt-8">
                <button class="btn-dark w-full py-3 rounded-xl font-medium text-base">
                    <i class="fas fa-paper-plane mr-2"></i> disponível para estágio
                </button>
                <button class="btn-outline-dark w-full py-3 rounded-xl font-medium text-base">
                    <i class="fas fa-download mr-2"></i> currículo
                </button>
            </div>

            <!-- rodapé do card -->
            <div class="text-center text-black/40 text-xs mt-6 pt-3 border-t border-black/10">
                ✦ dev in progress · 2025 ✦
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('a[href="#"]').forEach(link => {
            link.addEventListener('click', (e) => e.preventDefault());
        });
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                alert('isabelly.ribas@estudante.com');
            });
        });
    </script>
</body>
</html>
